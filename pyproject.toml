[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assisted-sgs-discovery"
version = "0.1.0"
description = "Reproducible code and benchmark artifacts for symbolic SGS closure discovery."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sgs_discovery*"]
exclude = ["sgs_discovery.vendor*"]
